<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>始業・終業報告（職員用）</title>
<style>
  :root {
    --bg:        #eef1f5;
    --panel:     #ffffff;
    --text:      #1a1a1a;
    --muted:     #5a6470;
    --line:      #c7ced6;
    --accent:    #1565c0;
    --accent-dk: #0d47a1;
    --start:     #1b7f4b;
    --end:       #b4551a;
    --error:     #b3261e;
    --error-bg:  #fdecea;
    --ok:        #1b7f4b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.7;
  }

  .wrap { max-width: 760px; margin: 0 auto; }

  h1 { font-size: 22px; text-align: center; margin: 8px 0 4px; }
  .sub { text-align: center; color: var(--muted); font-size: 14px; margin: 0 0 20px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
  }

  .hidden { display: none !important; }

  /* ★スクリーンリーダーにだけ読ませる文字。
     display:none にすると読み上げの対象から外れてしまうので、
     場所をずらして目に見えなくする方式にする。 */
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  /* 画面を切り替えたとき、その画面そのものにフォーカスを移す。
     読み上げの開始位置を作るためだけなので、枠は出さない。 */
  section[tabindex="-1"]:focus { outline: none; }

  label, .label { display: block; font-weight: 700; margin: 18px 0 6px; }
  .panel > *:first-child { margin-top: 0; }
  .hint { font-weight: 400; font-size: 14px; color: var(--muted); margin: -2px 0 8px; }

  input[type="text"], input[type="password"], select, textarea {
    width: 100%;
    padding: 12px;
    font-size: 17px;
    font-family: inherit;
    color: var(--text);
    background: #fff;
    border: 2px solid var(--line);
    border-radius: 8px;
  }
  textarea { min-height: 90px; resize: vertical; }

  input:focus, select:focus, textarea:focus, button:focus {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  button {
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    border-radius: 8px;
    border: 2px solid transparent;
  }

  .btn-main {
    width: 100%;
    padding: 15px;
    margin-top: 22px;
    color: #fff;
    background: var(--accent);
  }
  .btn-main:hover    { background: var(--accent-dk); }
  /* ★disabled ではなく aria-disabled を使う。
     disabled にするとブラウザがフォーカスを外してしまい、
     スクリーンリーダーの利用者が送信中に迷子になるため。 */
  .btn-main[aria-disabled="true"] { background: #9aa4b0; cursor: default; }
  .btn-main[aria-disabled="true"]:hover { background: #9aa4b0; }

  .btn-small {
    padding: 9px 16px;
    background: #fff;
    border: 2px solid var(--accent);
    color: var(--accent-dk);
  }
  .btn-small:hover { background: #eef4fb; }
  .btn-small[aria-disabled="true"] {
    border-color: #c7ced6; color: #9aa4b0; cursor: default; background: #fff;
  }

  .linkbtn {
    display: block;
    width: 100%;
    margin-top: 16px;
    padding: 10px;
    font-size: 15px;
    font-weight: 400;
    background: none;
    border: none;
    color: var(--accent);
    text-decoration: underline;
  }

  .msg { margin-top: 14px; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 700; }
  .msg-error { background: var(--error-bg); color: var(--error); border: 2px solid var(--error); }
  .msg-wait  { background: #eef4fb; color: var(--accent-dk); border: 2px solid #b9d2ee; font-weight: 400; }

  /* 一覧の上のバー */
  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .bar .who { font-weight: 700; margin-right: auto; }
  .bar select { width: auto; padding: 8px 10px; font-size: 15px; }
  .bar label.inline {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0;
    font-weight: 400;
    font-size: 15px;
  }
  .bar input[type="checkbox"] { width: 20px; height: 20px; }

  /* 報告カード */
  .card {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 14px;
    background: #fafbfc;
  }
  .card.done { background: #f4f7f4; }

  /* 見出し(h3)にしてある。報告が何十件も並ぶので、
     スクリーンリーダーの見出しジャンプで1件ずつ渡り歩けるようにするため。 */
  .card .top {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    margin: 0 0 8px;
    font-size: inherit;
    font-weight: 400;
  }
  .card .nm  { font-size: 18px; font-weight: 700; }
  .card .dt  { color: var(--muted); font-size: 14px; }
  .kind {
    display: inline-block;
    padding: 2px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
  }
  .kind.start { background: var(--start); }
  .kind.end   { background: var(--end); }
  .flag {
    margin-left: auto;
    font-size: 13px;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 999px;
  }
  .flag.yet  { background: #fdf3e7; color: #8a4014; border: 1px solid #e0a771; }
  .flag.done { background: #e7f3ec; color: var(--ok);  border: 1px solid #9ccbb0; }

  .card .item { display: flex; gap: 10px; padding: 3px 0; font-size: 15px; }
  .card .item dt { flex: 0 0 7em; font-weight: 700; color: var(--muted); margin: 0; }
  .card .item dd { flex: 1; margin: 0; white-space: pre-wrap; word-break: break-word; }

  .reply {
    margin: 8px 0 2px;
    padding: 9px 12px;
    background: #eef4fb;
    border-left: 4px solid var(--accent);
    border-radius: 0 8px 8px 0;
  }
  .reply-head { font-size: 13px; font-weight: 700; color: var(--accent-dk); margin-bottom: 2px; }
  .reply-body { font-size: 15px; white-space: pre-wrap; word-break: break-word; }

  /* 返信の定型文ボタン。押すと入力欄に入り、そのあと自由に書き足せる。
     文面はスプレッドシートの「返信定型文」シートで職員が管理する。 */
  .suggest { margin: 6px 0 10px; display: flex; flex-wrap: wrap; gap: 8px; }
  .suggest button {
    padding: 8px 13px;
    font-size: 14px;
    font-weight: 400;
    text-align: left;
    background: #eef4fb;
    border: 1px solid #b9d2ee;
    color: var(--accent-dk);
  }
  .suggest button:hover { background: #dfeaf7; }
  .suggest-label { font-size: 13px; color: var(--muted); margin: 0 0 2px; }

  .replybox { margin-top: 10px; }
  .replybox textarea { min-height: 70px; font-size: 16px; }
  .replybox .row { display: flex; gap: 10px; margin-top: 8px; }
  .replybox .row button { flex: 0 0 auto; }

  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 3px solid rgba(255,255,255,0.45);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: -3px;
    margin-right: 8px;
  }
  .spinner-dark { border-color: #d3d9df; border-top-color: var(--accent); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }

  .loading-box { text-align: center; padding: 20px 0; color: var(--muted); }

  .pin-row { position: relative; }
  .pin-toggle {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    padding: 7px 11px; font-size: 14px; font-weight: 400;
    background: #eef1f4; border: 1px solid var(--line); color: var(--text);
  }
</style>
</head>
<body>
<div class="wrap">

  <h1>始業・終業報告（職員用）</h1>
  <p class="sub">利用者からの報告を見て、その場で返信できます</p>

  <!-- ★スクリーンリーダーへの読み上げ専用の場所。
       画面が切り替わっただけでは何が起きたか伝わらないので、
       「送信しました」「○件」などをここに書き込んで読ませる。
       常に画面上に存在させておくこと(隠したり出したりすると読まれない)。 -->
  <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div id="announcerAlert" class="sr-only" role="alert" aria-atomic="true"></div>

  <!-- ===== 読み込み中 ===== -->
  <section id="screen-loading" class="panel hidden" tabindex="-1" aria-labelledby="h-loading">
    <h2 id="h-loading" class="sr-only">読み込み中</h2>
    <div class="loading-box">
      <div class="spinner spinner-dark" role="presentation"></div>
      <p>読み込んでいます</p>
    </div>
  </section>

  <!-- ===== ログイン ===== -->
  <section id="screen-login" class="panel hidden" tabindex="-1" aria-labelledby="h-login">
    <h2 id="h-login" class="label" style="margin-top:0;">職員ログイン</h2>

    <label for="staffNo">職員番号</label>
    <p class="hint" id="hint-staffNo">スプレッドシートの「職員」シートに載っています</p>
    <input id="staffNo" type="text" inputmode="numeric" autocomplete="username"
           maxlength="10" enterkeyhint="next" aria-describedby="hint-staffNo">

    <label for="pin">暗証番号（4桁）</label>
    <div class="pin-row">
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password"
             maxlength="4" enterkeyhint="go">
      <button type="button" id="pinToggle" class="pin-toggle"
              aria-pressed="false" aria-label="暗証番号を表示する">表示</button>
    </div>

    <button type="button" id="btnLogin" class="btn-main">ログイン</button>
    <div id="loginMsg" class="msg msg-error hidden"></div>
  </section>

  <!-- ===== 一覧 ===== -->
  <section id="screen-list" class="hidden" tabindex="-1" aria-labelledby="h-list">
    <!-- ★sr-only にしてある。display:none だと画面の名前として使えず、
         見出しジャンプでもここに飛べないため。 -->
    <h2 id="h-list" class="sr-only">報告の一覧</h2>

    <div class="bar">
      <span class="who" id="who"></span>
      <label class="inline" for="days">期間
        <!-- プルダウンを label で囲んでいるので、
             選択肢まで名前に混ざらないよう aria-label で上書きする -->
        <select id="days" aria-label="期間">
          <option value="1">本日</option>
          <option value="3">3日</option>
          <option value="7" selected>1週間</option>
          <option value="14">2週間</option>
        </select>
      </label>
      <label class="inline" for="onlyYet">
        <input type="checkbox" id="onlyYet"> 未返信だけ
      </label>
      <button type="button" id="btnReload" class="btn-small">更新</button>
    </div>

    <div id="listBody"></div>
    <div id="listMsg" class="msg msg-error hidden"></div>

    <button type="button" id="btnLogout" class="linkbtn">ログアウト</button>
  </section>

</div>

<script>
/* =======================================================================
 * 職員用の画面
 * ---------------------------------------------------------------------
 * ★利用者の画面(index.html)とは完全に別のファイルにしてある。
 *   利用者の画面に職員向けの入り口を置かないため。
 * ★職員のトークンは利用者のトークンと別物で、サーバー側で区別している。
 *   利用者の番号でここにログインすることはできない。
 * ======================================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbyiTqv-ryfVZVKLH2JIn2qSJtWyTwe8l3i-8JNmDU8NoQeKUxcueg76h8MxXBMfHyAGog/exec';

const TOKEN_KEY = 'wing_staff_token';   // 利用者用(wing_report_token)とは別のキー
const TIMEOUT_MS = 25000;

/* --- 画面の切り替え --------------------------------------------------- */
const screens = {
  loading: document.getElementById('screen-loading'),
  login:   document.getElementById('screen-login'),
  list:    document.getElementById('screen-list')
};
/* ★スクリーンリーダーへの読み上げ。
 * 画面の隅に置いた読み上げ専用の場所に文字を入れると読まれる。目には見えない。
 * 同じ文言を続けて入れても読み直さないので、いったん空にしてから入れる。 */
function announce(text, assertive) {
  const el = document.getElementById(assertive ? 'announcerAlert' : 'announcer');
  if (!el) return;
  el.textContent = '';
  setTimeout(() => { el.textContent = text; }, 60);
}

/* ★画面の切り替えは display:none の付け外しだけなので、そのままだと
 * 読み上げの位置は消えた画面に残ったままになる。
 * 新しい画面そのもの(tabindex="-1")にフォーカスを移して読み直させる。 */
function show(which) {
  Object.keys(screens).forEach(k => screens[k].classList.toggle('hidden', k !== which));
  window.scrollTo(0, 0);
  const el = screens[which];
  if (el) el.focus({ preventScroll: true });
}

/* --- サーバーとのやりとり ----------------------------------------------
 * Content-Type を text/plain にしているのは、ブラウザの事前確認通信
 * (CORS preflight)を避けるため。Apps Script はこれに応答できないため。
 * 応答が返らないまま待たされることがあるので、時間で打ち切る。
 * --------------------------------------------------------------------- */
async function callApi(payload, timeoutMs) {
  const ctrl  = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs || TIMEOUT_MS);
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
      signal: ctrl.signal
    });
    if (!res.ok) throw new Error('http ' + res.status);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

/* POSTなのに動作確認用のdoGetの返事が返ってくることがある。
 * ok だけ見ると誤判定するので、期待する項目の有無まで確かめる。 */
async function callApiRetry(payload, attempts, requiredField) {
  let lastErr;
  for (let i = 0; i < attempts; i++) {
    try {
      const r = await callApi(payload);
      if (requiredField && r && r.ok === true && r[requiredField] === undefined) {
        throw new Error('unexpected response');
      }
      return r;
    } catch (e) {
      lastErr = e;
      if (i < attempts - 1) await new Promise(s => setTimeout(s, 2000 * (i + 1)));
    }
  }
  throw lastErr;
}

/* ★btn.disabled ではなく aria-disabled を使う。
 * disabled にするとブラウザがフォーカスをボタンから外してしまい、
 * 読み上げを頼りにしている人が待っている間に迷子になるため。
 * 二度押しは isBusy() で防ぐ。 */
function setBusy(btn, label) {
  btn.dataset.label = btn.dataset.label || btn.textContent;
  btn.setAttribute('aria-disabled', 'true');
  btn.dataset.busy = '1';
  btn.innerHTML = '<span class="spinner" role="presentation"></span>' + label;
  announce(label);
}
function setIdle(btn, label) {
  btn.removeAttribute('aria-disabled');
  delete btn.dataset.busy;
  btn.textContent = label || btn.dataset.label || '';
}
function isBusy(btn) { return btn.dataset.busy === '1'; }

/* 読み上げは announce() に一本化してある。
 * role="alert" を付けた要素を display:none から出す形だと、
 * 読まれたり読まれなかったりで当てにならないため。 */
function showError(el, text) {
  el.textContent = text;
  el.classList.add('msg-error');
  el.classList.remove('msg-wait', 'hidden');
  announce(text, true);
}
function clearError(el) {
  el.textContent = '';
  el.classList.add('hidden');
}

/* --- ログイン --------------------------------------------------------- */
const loginMsg = document.getElementById('loginMsg');
let staffName = '';

document.getElementById('pinToggle').addEventListener('click', () => {
  const pin = document.getElementById('pin');
  const btn = document.getElementById('pinToggle');
  const showing = pin.type === 'text';
  pin.type = showing ? 'password' : 'text';
  btn.textContent = showing ? '表示' : '隠す';
  btn.setAttribute('aria-pressed', String(!showing));
  btn.setAttribute('aria-label', showing ? '暗証番号を表示する' : '暗証番号を隠す');
});

async function doLogin() {
  const btn     = document.getElementById('btnLogin');
  if (isBusy(btn)) return;
  const staffNo = document.getElementById('staffNo').value.trim();
  const pin     = document.getElementById('pin').value.trim();
  clearError(loginMsg);

  // 直すべき欄までフォーカスを連れて行く
  if (!staffNo || !pin) {
    showError(loginMsg, '職員番号と暗証番号を入力してください。');
    document.getElementById(staffNo ? 'pin' : 'staffNo').focus();
    return;
  }

  setBusy(btn, '確認しています…');
  try {
    const r = await callApiRetry({ action: 'staffLogin', staffNo, pin }, 2, 'token');
    if (r.ok) {
      localStorage.setItem(TOKEN_KEY, r.token);
      document.getElementById('pin').value = '';
      staffName = r.name;
      enterList();
    } else if (r.error === 'locked') {
      showError(loginMsg, '暗証番号を続けて間違えたため、しばらくログインできません。15分ほど待ってからお試しください。');
      document.getElementById('staffNo').focus();
    } else {
      showError(loginMsg, '職員番号または暗証番号が違います。' +
        (typeof r.rest === 'number' ? `（あと${r.rest}回まで）` : ''));
      document.getElementById('pin').focus();
    }
  } catch (e) {
    showError(loginMsg, '通信に失敗しました。電波の状態を確認して、もう一度お試しください。');
  } finally {
    setIdle(btn, 'ログイン');
  }
}

document.getElementById('btnLogin').addEventListener('click', doLogin);
document.getElementById('pin').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('staffNo').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('pin').focus();
});

/* --- 一覧 ------------------------------------------------------------- */
const listMsg = document.getElementById('listMsg');
let items = [];

/* 返信の定型文。始業への返信と終業への返信で使い分ける。
 * ★中身はスプレッドシートの「返信定型文」シートから来る。
 *   一覧を読み込むたびに一緒に受け取るので、通信の往復は増えない。
 *   職員がシートを直せば、次に「更新」を押したときから新しい文面になる。 */
let templates = { '始業': [], '終業': [] };

function enterList() {
  document.getElementById('who').textContent = staffName + ' さん';
  show('list');
  loadList();
}

function newReqId() {
  return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

async function loadList() {
  const btn  = document.getElementById('btnReload');
  if (isBusy(btn)) return;
  const body = document.getElementById('listBody');
  clearError(listMsg);
  body.innerHTML = '<div class="loading-box"><div class="spinner spinner-dark"></div><p>読み込んでいます</p></div>';

  setBusy(btn, '更新中');
  try {
    const r = await callApiRetry({
      action: 'staffList',
      token: localStorage.getItem(TOKEN_KEY),
      days: Number(document.getElementById('days').value)
    }, 2, 'items');

    if (r.ok) {
      staffName = r.name || staffName;
      document.getElementById('who').textContent = staffName + ' さん';
      items = r.items || [];
      if (r.templates) templates = r.templates;   // シートで直した文面がここで反映される
      renderList();
    } else if (r.error === 'unauthorized') {
      logout('ログインの有効期限が切れました。もう一度ログインしてください。');
    } else {
      body.innerHTML = '';
      showError(listMsg, '読み込めませんでした。もう一度お試しください。');
    }
  } catch (e) {
    body.innerHTML = '';
    showError(listMsg, '通信に失敗しました。電波の状態を確認して、「更新」を押してください。');
  } finally {
    setIdle(btn, '更新');
  }
}

function addItem(dl, label, value) {
  if (!value) return;
  const row = document.createElement('div');
  const dt  = document.createElement('dt');
  const dd  = document.createElement('dd');
  row.className = 'item';
  dt.textContent = label;
  dd.textContent = value;
  row.appendChild(dt);
  row.appendChild(dd);
  dl.appendChild(row);
}

function renderList(quiet) {
  const body    = document.getElementById('listBody');
  const onlyYet = document.getElementById('onlyYet').checked;
  body.innerHTML = '';

  const shown = items.filter(it => !onlyYet || !it.replies.length);
  if (!shown.length) {
    const p = document.createElement('p');
    p.className = 'hint';
    p.style.textAlign = 'center';
    p.textContent = onlyYet ? '未返信の報告はありません。' : 'この期間の報告はありません。';
    body.appendChild(p);
    if (!quiet) announce(p.textContent);
    return;
  }

  shown.forEach(it => body.appendChild(renderCard(it)));

  // 何件あって、そのうち何件が未返信かを読み上げる。
  // 一覧を目で見渡せない人にとっては、これが全体像になる。
  if (!quiet) {
    const yet = shown.filter(it => !it.replies.length).length;
    announce(shown.length + '件を表示しました。うち未返信は' + yet + '件です。');
  }
}

// focusOpen: 返信を送ったあとにカードを作り直すとき、
// 「返信する」ボタンへフォーカスを戻すかどうか
function renderCard(it, focusOpen) {
  const card = document.createElement('div');
  card.className = 'card' + (it.replies.length ? ' done' : '');

  // 1件ごとに見出しにしておく。報告が何十件も並ぶので、
  // 読み上げの見出しジャンプで渡り歩けるようにするため。
  const top  = document.createElement('h3');
  const nm   = document.createElement('span');
  const kind = document.createElement('span');
  const dt   = document.createElement('span');
  const flag = document.createElement('span');
  top.className  = 'top';
  nm.className   = 'nm';
  kind.className = 'kind ' + (it.kubun === '始業' ? 'start' : 'end');
  dt.className   = 'dt';
  flag.className = 'flag ' + (it.replies.length ? 'done' : 'yet');
  nm.textContent   = it.name;
  kind.textContent = it.kubun;
  dt.textContent   = it.date + ' ' + it.time;
  flag.textContent = it.replies.length ? '返信済み' : '未返信';
  top.appendChild(nm);
  top.appendChild(kind);
  top.appendChild(dt);
  top.appendChild(flag);
  card.appendChild(top);

  const dl = document.createElement('dl');
  dl.style.margin = '0';
  addItem(dl, '体調', it.taicho);
  addItem(dl, '昼等休憩', it.kyukei);
  addItem(dl, '訓練・作業内容', it.sagyo);
  addItem(dl, '備考', it.biko);
  addItem(dl, '自由記述', it.memo);
  card.appendChild(dl);

  it.replies.forEach(r => {
    const box  = document.createElement('div');
    const head = document.createElement('div');
    const bd   = document.createElement('div');
    box.className  = 'reply';
    head.className = 'reply-head';
    bd.className   = 'reply-body';
    head.textContent = (r.who || '職員') + ' より' + (r.at ? '（' + r.at + '）' : '');
    bd.textContent   = r.text || '';
    box.appendChild(head);
    box.appendChild(bd);
    card.appendChild(box);
  });

  card.appendChild(renderReplyBox(it, card, focusOpen));
  return card;
}

/* 返信の入力欄。最初はボタンだけを出しておき、押したら広がる。
 * 一覧に何十件も並ぶので、最初から入力欄を出すと画面が長くなりすぎるため。 */
function renderReplyBox(it, card, focusOpen) {
  const wrap = document.createElement('div');
  wrap.className = 'replybox';

  const open = document.createElement('button');
  open.type = 'button';
  open.className = 'btn-small';
  open.textContent = it.replies.length ? 'さらに返信する' : '返信する';
  /* ★「返信する」ボタンが件数ぶん並ぶ。読み上げでボタンを拾い読みしたとき
       どの報告のものか分かるよう、宛先を名前に含める。 */
  open.setAttribute('aria-label',
    open.textContent + '：' + it.name + 'さんの' + it.kubun
    + '（' + it.date + ' ' + it.time + '）');
  wrap.appendChild(open);
  // 返信を送ったあとの作り直しでは、ここにフォーカスを戻す
  if (focusOpen) setTimeout(() => open.focus(), 0);

  const form = document.createElement('div');
  form.className = 'hidden';
  const ta = document.createElement('textarea');
  ta.setAttribute('aria-label', it.name + 'さんの' + it.kubun + 'の報告への返信');
  ta.placeholder = 'ここに返信を書いてください';
  const row  = document.createElement('div');
  const send = document.createElement('button');
  const cancel = document.createElement('button');
  const msg  = document.createElement('div');
  row.className    = 'row';
  send.type        = 'button';
  send.className   = 'btn-small';
  send.textContent = '送信する';
  cancel.type        = 'button';
  cancel.className   = 'btn-small';
  cancel.textContent = 'やめる';
  msg.className = 'msg msg-error hidden';
  row.appendChild(send);
  row.appendChild(cancel);

  /* 定型文のボタン。始業への返信か終業への返信かで出し分ける。
   * 押しても入力欄を上書きせず、改行して足すだけにしてある。
   * いくつか組み合わせてから、続けて自由に書けるようにするため。 */
  const tpl = templates[it.kubun] || [];
  if (tpl.length) {
    const lab = document.createElement('p');
    const box = document.createElement('div');
    lab.className = 'suggest-label';
    lab.textContent = 'よく使う文（押すと入ります）';
    box.className = 'suggest';
    box.setAttribute('role', 'group');
    box.setAttribute('aria-label', it.kubun + 'への返信によく使う文');

    tpl.forEach(t => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = t;
      // ボタンが並ぶので、押すと何が起きるかを読み上げだけで分かるようにする
      b.setAttribute('aria-label', '「' + t + '」を入れる');
      b.addEventListener('click', () => {
        const now = ta.value.replace(/\s+$/, '');
        ta.value = now ? now + '\n' + t : t;
        ta.focus();
        // カーソルを末尾に置いて、そのまま続きが書けるようにする
        ta.setSelectionRange(ta.value.length, ta.value.length);
        announce('入れました。' + t);
      });
      box.appendChild(b);
    });
    form.appendChild(lab);
    form.appendChild(box);
  }

  form.appendChild(ta);
  form.appendChild(row);
  form.appendChild(msg);
  wrap.appendChild(form);

  open.addEventListener('click', () => {
    form.classList.remove('hidden');
    open.classList.add('hidden');
    ta.focus();
  });
  cancel.addEventListener('click', () => {
    form.classList.add('hidden');
    open.classList.remove('hidden');
    clearError(msg);
    open.focus();   // 入力欄が消えるので、フォーカスを元のボタンに戻す
  });

  /* 二重登録を防ぐための引換番号。
   * 「通信に失敗しました」と出てもサーバー側では受け付けられていることがあるので、
   * やり直しには同じ番号を送る。成功したら捨てる。 */
  let pendingReqId = null;

  send.addEventListener('click', async () => {
    if (isBusy(send)) return;
    const text = ta.value.trim();
    clearError(msg);
    if (!text) {
      showError(msg, '返信の内容を入力してください。');
      ta.focus();
      return;
    }
    if (!pendingReqId) pendingReqId = newReqId();

    setBusy(send, '送信中');
    try {
      const r = await callApiRetry({
        action: 'staffReply',
        token: localStorage.getItem(TOKEN_KEY),
        reqId: pendingReqId,
        uid:  it.uid,
        body: text
      }, 2, 'uid');

      if (r.ok) {
        pendingReqId = null;
        ta.value = '';
        form.classList.add('hidden');
        open.classList.remove('hidden');
        // 送った内容をその場に足す。一覧を読み直さなくても見えるように。
        it.replies.push({ who: r.who || staffName, text: text, at: '送信しました' });
        /* ★カードをまるごと作り直すので、いま押していたボタンが消えて
             フォーカスが行き場を失う。新しいカードの「返信する」に戻す。 */
        card.replaceWith(renderCard(it, true));
        announce(it.name + 'さんの' + it.kubun + 'への返信を送信しました。');
      } else if (r.error === 'unauthorized') {
        logout('ログインの有効期限が切れました。もう一度ログインしてください。');
      } else if (r.error === 'report_not_found') {
        showError(msg, 'この報告が見つかりませんでした。「更新」を押して、一覧を読み直してください。');
      } else {
        showError(msg, '送信できませんでした。もう一度お試しください。');
      }
    } catch (e) {
      showError(msg, '送信できたかどうか確認できませんでした。「更新」を押して確かめてください。'
        + 'もう一度送っても、同じ返信が二重に登録されることはありません。');
    } finally {
      setIdle(send, '送信する');
    }
  });

  return wrap;
}

document.getElementById('btnReload').addEventListener('click', loadList);
document.getElementById('days').addEventListener('change', loadList);
document.getElementById('onlyYet').addEventListener('change', renderList);

/* --- ログアウト ------------------------------------------------------- */
function logout(message) {
  localStorage.removeItem(TOKEN_KEY);
  staffName = '';
  items = [];
  document.getElementById('staffNo').value = '';
  document.getElementById('pin').value = '';
  clearError(loginMsg);
  if (message) showError(loginMsg, message);
  show('login');
}
document.getElementById('btnLogout').addEventListener('click', () => logout());

/* --- 起動時 ----------------------------------------------------------- */
(async function start() {
  const token = localStorage.getItem(TOKEN_KEY);
  if (!token) { show('login'); return; }

  show('loading');
  try {
    const r = await callApiRetry({ action: 'staffMe', token }, 2, 'name');
    if (r.ok) { staffName = r.name; enterList(); return; }
    // サーバーが明確に「無効」と答えた場合だけ捨てる
    localStorage.removeItem(TOKEN_KEY);
    show('login');
    showError(loginMsg, 'ログインの有効期限が切れました。もう一度ログインしてください。');
  } catch (e) {
    // 通信できなかっただけならログイン情報は消さない
    show('login');
    showError(loginMsg, '通信に失敗しました。電波の状態を確認して、画面を再読み込みしてください。');
  }
})();
</script>
