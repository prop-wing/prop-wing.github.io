<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>始業・終業報告</title>
<style>
  :root {
    --bg:        #f4f6f8;
    --panel:     #ffffff;
    --text:      #1a1a1a;
    --muted:     #5a6470;
    --line:      #c7ced6;
    --accent:    #1565c0;
    --accent-dk: #0d47a1;
    --start:     #1b7f4b;
    --start-dk:  #145c36;
    --end:       #b4551a;
    --end-dk:    #8a4014;
    --error:     #b3261e;
    --error-bg:  #fdecea;
    --ok:        #1b7f4b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    font-size: 18px;
    line-height: 1.7;
  }

  .wrap { max-width: 560px; margin: 0 auto; }

  h1 {
    font-size: 26px;
    text-align: center;
    margin: 8px 0 20px;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 22px 20px;
  }

  .hidden { display: none !important; }

  label, .label {
    display: block;
    font-weight: 700;
    font-size: 18px;
    margin: 20px 0 8px;
  }
  .panel > *:first-child { margin-top: 0; }

  .hint {
    font-weight: 400;
    font-size: 15px;
    color: var(--muted);
    margin: -4px 0 8px;
  }

  input[type="text"],
  input[type="password"],
  select,
  textarea {
    width: 100%;
    padding: 14px;
    font-size: 20px;
    font-family: inherit;
    color: var(--text);
    background: #fff;
    border: 2px solid var(--line);
    border-radius: 8px;
  }
  textarea { min-height: 120px; resize: vertical; }

  input:focus, select:focus, textarea:focus, button:focus {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  button {
    font-family: inherit;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    border-radius: 8px;
    border: 2px solid transparent;
  }

  .btn-main {
    width: 100%;
    padding: 18px;
    margin-top: 26px;
    color: #fff;
    background: var(--accent);
  }
  .btn-main:hover  { background: var(--accent-dk); }
  .btn-main:disabled { background: #9aa4b0; cursor: default; }

  /* 始業・終業の選択ボタン */
  .kubun { display: flex; gap: 12px; }
  .kubun button {
    flex: 1;
    padding: 22px 8px;
    font-size: 22px;
    background: #fff;
    border: 2px solid var(--line);
    color: var(--muted);
  }
  .kubun button[aria-pressed="true"][data-kubun="始業"] {
    background: var(--start); border-color: var(--start-dk); color: #fff;
  }
  .kubun button[aria-pressed="true"][data-kubun="終業"] {
    background: var(--end); border-color: var(--end-dk); color: #fff;
  }

  .greet {
    font-size: 22px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 4px;
  }
  .today {
    text-align: center;
    color: var(--muted);
    font-size: 16px;
    margin-bottom: 20px;
  }

  .msg {
    margin-top: 18px;
    padding: 14px;
    border-radius: 8px;
    font-size: 17px;
    font-weight: 700;
  }
  .msg-error { background: var(--error-bg); color: var(--error); border: 2px solid var(--error); }
  .msg-wait  { background: #eef4fb; color: var(--accent-dk); border: 2px solid #b9d2ee; font-weight: 400; }
  /* 間違いではないが気づいてほしいこと。赤にすると不安を煽るので橙にする */
  .msg-caution { background: #fdf3e7; color: #8a4014; border: 2px solid #e0a771; }

  .linkbtn {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    font-size: 16px;
    font-weight: 400;
    background: none;
    border: none;
    color: var(--accent);
    text-decoration: underline;
  }

  .done-mark {
    text-align: center;
    font-size: 56px;
    color: var(--ok);
    line-height: 1;
    margin-bottom: 8px;
  }
  .done-title {
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 20px;
  }
  .summary {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px 16px;
    background: #fafbfc;
  }
  .summary dl { margin: 0; }
  .summary div { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid #e6eaee; }
  .summary div:last-child { border-bottom: none; }
  .summary dt { flex: 0 0 100px; font-weight: 700; color: var(--muted); margin: 0; }
  .summary dd { margin: 0; flex: 1; white-space: pre-wrap; word-break: break-word; }

  /* 待機中のぐるぐる表示 */
  .spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 3px solid rgba(255, 255, 255, 0.45);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: -4px;
    margin-right: 10px;
  }
  .spinner-dark {
    width: 28px;
    height: 28px;
    border-color: #d3d9df;
    border-top-color: var(--accent);
    margin: 0 0 14px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 動きが苦手な方の設定を尊重する */
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 2.4s; }
  }

  /* 本日すでに報告したかどうかの表示 */
  .today-status {
    border: 2px solid var(--line);
    border-radius: 10px;
    padding: 4px 14px;
    margin-bottom: 22px;
    background: #fafbfc;
  }
  .today-status .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    font-size: 17px;
    border-bottom: 1px solid #e6eaee;
  }
  .today-status .row:last-child { border-bottom: none; }
  .today-status .k { flex: 0 0 3.5em; font-weight: 700; }
  .today-status .done { color: var(--start); font-weight: 700; }
  .today-status .yet  { color: var(--muted); }
  .today-status .mark { font-size: 19px; }

  .loading-box { text-align: center; padding: 18px 0; }
  .loading-box .lead { font-size: 19px; font-weight: 700; margin: 0 0 6px; }
  .loading-box .sub  { font-size: 15px; color: var(--muted); margin: 0; }

  /* 体調の選択(3つのボタン)。プルダウンより押しやすいのでボタンにしている */
  .choice { display: flex; gap: 10px; }
  .choice button {
    flex: 1;
    padding: 16px 4px;
    font-size: 18px;
    background: #fff;
    border: 2px solid var(--line);
    color: var(--muted);
  }
  .choice button[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent-dk); color: #fff;
  }

  /* 訓練・作業内容の候補。本人が前に書いた内容を押すだけで入れられる */
  .suggest { margin: 8px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .suggest button {
    padding: 9px 14px;
    font-size: 15px;
    font-weight: 400;
    text-align: left;
    background: #eef4fb;
    border: 1px solid #b9d2ee;
    color: var(--accent-dk);
  }
  .suggest button:hover { background: #dfeaf7; }
  .suggest-label {
    font-size: 14px;
    color: var(--muted);
    margin: 14px 0 0;
  }

  /* 職員からの返信 */
  .reply {
    margin: 8px 0 2px;
    padding: 10px 12px;
    background: #eef4fb;
    border-left: 4px solid var(--accent);
    border-radius: 0 8px 8px 0;
  }
  .reply-head {
    font-size: 14px;
    font-weight: 700;
    color: var(--accent-dk);
    margin-bottom: 3px;
  }
  .reply-body { font-size: 16px; white-space: pre-wrap; word-break: break-word; }

  /* これまでの報告 */
  .histday {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 16px;
    background: #fafbfc;
  }
  .histday h3 { margin: 0 0 10px; font-size: 19px; }
  .histblk { margin-bottom: 14px; }
  .histblk:last-child { margin-bottom: 0; }
  .histblk .kind {
    display: inline-block;
    padding: 3px 12px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 6px;
  }
  .histblk .kind.start { background: var(--start); }
  .histblk .kind.end   { background: var(--end); }
  .histblk .item { display: flex; gap: 10px; padding: 4px 0; font-size: 16px; }
  .histblk .item dt { flex: 0 0 6.5em; font-weight: 700; color: var(--muted); margin: 0; }
  .histblk .item dd { flex: 1; margin: 0; white-space: pre-wrap; word-break: break-word; }
  .histnone { font-size: 15px; color: var(--muted); }

  .pin-row { position: relative; }
  .pin-toggle {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    padding: 8px 12px; font-size: 15px; font-weight: 400;
    background: #eef1f4; border: 1px solid var(--line); color: var(--text);
  }
</style>
</head>
<body>
<div class="wrap">

  <h1>始業・終業報告</h1>

  <!-- ===== 画面0: 読み込み中 =====
       ログイン状態が保存されていると、確認が終わるまで数秒かかる。
       その間を空白にすると「壊れた」と思われるので必ず何か出す。 -->
  <section id="screen-loading" class="panel hidden" aria-live="polite">
    <div class="loading-box">
      <div class="spinner spinner-dark" role="presentation"></div>
      <p class="lead">読み込んでいます</p>
      <p class="sub">10秒ほどかかることがあります</p>
    </div>
  </section>

  <!-- ===== 画面1: ログイン ===== -->
  <section id="screen-login" class="panel hidden" aria-labelledby="h-login">
    <h2 id="h-login" class="label" style="margin-top:0;">ログイン</h2>

    <label for="userNo">利用者番号</label>
    <p class="hint">職員からお伝えした番号を入力してください</p>
    <input id="userNo" type="text" inputmode="numeric" autocomplete="username"
           maxlength="10" enterkeyhint="next">

    <label for="pin">暗証番号（4桁）</label>
    <div class="pin-row">
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password"
             maxlength="4" enterkeyhint="go">
      <button type="button" id="pinToggle" class="pin-toggle" aria-label="暗証番号を表示">表示</button>
    </div>

    <button type="button" id="btnLogin" class="btn-main">ログイン</button>
    <div id="loginMsg" class="msg msg-error hidden" role="alert"></div>
  </section>

  <!-- ===== 画面2: 報告の入力 ===== -->
  <section id="screen-report" class="panel hidden" aria-labelledby="h-report">
    <p id="greet" class="greet"></p>
    <p id="today" class="today"></p>

    <!-- 本日すでに報告したかどうか。
         「送れたか分からない」不安をなくすのが目的なので、
         入力欄より先、画面を開いてすぐ目に入る位置に置く。 -->
    <div class="today-status" id="todayStatus" aria-live="polite">
      <div class="row">
        <span class="k">始業</span>
        <span class="mark" id="ts-start-mark" aria-hidden="true"></span>
        <span id="ts-start"></span>
      </div>
      <!-- 職員からの返信。届いていなければ何も出ない -->
      <div id="ts-start-replies"></div>
      <div class="row">
        <span class="k">終業</span>
        <span class="mark" id="ts-end-mark" aria-hidden="true"></span>
        <span id="ts-end"></span>
      </div>
      <div id="ts-end-replies"></div>
    </div>

    <h2 id="h-report" class="label">区分</h2>
    <div class="kubun" role="group" aria-label="区分を選んでください">
      <button type="button" data-kubun="始業" aria-pressed="false">始業</button>
      <button type="button" data-kubun="終業" aria-pressed="false">終業</button>
    </div>

    <label for="time">時刻</label>
    <select id="time"></select>

    <!-- ===== 始業のときだけ出る ===== -->
    <div id="sec-start" class="hidden">
      <p class="label" id="lbl-taicho">体調</p>
      <div class="choice" role="group" aria-labelledby="lbl-taicho">
        <button type="button" data-taicho="良好"   aria-pressed="false">良好</button>
        <button type="button" data-taicho="やや不良" aria-pressed="false">やや不良</button>
        <button type="button" data-taicho="不良"   aria-pressed="false">不良</button>
      </div>
    </div>

    <!-- ===== 終業のときだけ出る ===== -->
    <div id="sec-end" class="hidden">
      <label for="kyukei">昼等休憩</label>
      <p class="hint">お昼などで休んだ時間の合計を選んでください</p>
      <select id="kyukei"></select>

      <label for="sagyo">訓練・作業内容</label>
      <p class="hint">今日おこなった内容を書いてください（簡単で結構です）</p>
      <textarea id="sagyo" style="min-height:80px" enterkeyhint="done"></textarea>
      <p class="suggest-label hidden" id="sagyoSuggestLabel">前に書いた内容（押すと入ります）</p>
      <div class="suggest" id="sagyoSuggest"></div>

      <label for="biko">備考</label>
      <p class="hint">作業に関して気づいたことや、他のサービスを使った時間など。<br>
        例：14:45〜15:45 ヘルパー入浴 / 13:30〜14:30 訪問リハビリ</p>
      <textarea id="biko" style="min-height:80px" enterkeyhint="done"></textarea>
    </div>

    <label for="memo">自由記述（任意）</label>
    <p class="hint">挨拶や、業務と関係のない話などをどうぞ。書かなくても送れます</p>
    <textarea id="memo" style="min-height:90px" enterkeyhint="done"></textarea>

    <button type="button" id="btnSend" class="btn-main">送信する</button>
    <div id="reportMsg" class="msg msg-error hidden" role="alert"></div>

    <button type="button" id="btnHistory" class="linkbtn">これまでの報告を見る</button>
    <button type="button" id="btnLogout" class="linkbtn">別の人が使う（ログアウト）</button>
  </section>

  <!-- ===== 画面4: これまでの報告 ===== -->
  <section id="screen-history" class="panel hidden" aria-labelledby="h-history">
    <p id="h-history" class="done-title" style="margin-bottom:4px;">これまでの報告</p>
    <p class="hint" style="text-align:center;">新しい日から順に表示しています</p>
    <div id="historyBody"></div>
    <div id="historyMsg" class="msg msg-error hidden" role="alert"></div>
    <button type="button" id="btnHistoryBack" class="btn-main">報告の画面にもどる</button>
  </section>

  <!-- ===== 画面3: 送信完了 ===== -->
  <section id="screen-done" class="panel hidden" aria-labelledby="h-done">
    <p class="done-mark" aria-hidden="true">✓</p>
    <p id="h-done" class="done-title">送信しました</p>
    <!-- 送った項目だけを並べる。中身は送信時に組み立てる -->
    <div class="summary">
      <dl id="s-list"></dl>
    </div>
    <button type="button" id="btnAgain" class="btn-main">続けて報告する</button>
    <button type="button" id="btnLogout2" class="linkbtn">別の人が使う（ログアウト）</button>
  </section>

</div>

<script>
/* =======================================================================
 * 設定
 * ---------------------------------------------------------------------
 * API_URL には Apps Script を「ウェブアプリ」としてデプロイしたときに
 * 表示される https://script.google.com/macros/s/......../exec を貼る。
 * ======================================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbyiTqv-ryfVZVKLH2JIn2qSJtWyTwe8l3i-8JNmDU8NoQeKUxcueg76h8MxXBMfHyAGog/exec';

const TOKEN_KEY = 'wing_report_token';

/* --- 画面の切り替え --------------------------------------------------- */
const screens = {
  loading: document.getElementById('screen-loading'),
  login:   document.getElementById('screen-login'),
  report:  document.getElementById('screen-report'),
  done:    document.getElementById('screen-done'),
  history: document.getElementById('screen-history')
};
function show(which) {
  Object.keys(screens).forEach(k => screens[k].classList.toggle('hidden', k !== which));
  window.scrollTo(0, 0);
}

/* --- サーバーとのやりとり ----------------------------------------------
 * Content-Type を text/plain にしているのは、ブラウザの事前確認通信
 * (CORS preflight)を避けるため。Apps Script はこれに応答できないため。
 * --------------------------------------------------------------------- */
/* 応答が返ってこないまま何十秒も待たされることがあるので、時間で打ち切る。
 * 打ち切っても、同じ引換番号を送るやり直しは二重登録にならないので安全。
 * サーバー側の処理は実測で1〜7秒なので、25秒あれば十分に余裕がある。 */
const TIMEOUT_MS = 25000;

async function callApi(payload, timeoutMs) {
  const ctrl  = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs || TIMEOUT_MS);
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
      signal: ctrl.signal
    });
    if (!res.ok) throw new Error('http ' + res.status);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

/* Apps Script は、処理そのものは1秒台で終わっているのに
 * 応答がブラウザまで届かず失敗することがある(実行ログと突き合わせて確認済み)。
 * 同じ引換番号を送るので、やり直しても二重登録にはならない。
 *
 * 自動のやり直しは1回だけにしている。失敗する試行自体が30秒以上かかることが
 * あり、回数を増やすと利用者を何分も待たせることになるため。
 * それでも駄目なときは画面に案内を出して、本人に押し直してもらう。 */
async function callApiRetry(payload, attempts, requiredField, timeoutMs) {
  let lastErr;
  for (let i = 0; i < attempts; i++) {
    try {
      const r = await callApi(payload, timeoutMs);
      // 応答が別物のことがある。実際に、POSTなのに動作確認用のdoGetの返事
      // ({ok:true, message:...})が返ってきた。ok だけ見ると「名前が空のまま
      // ログイン成功」と誤判定するので、期待する項目の有無まで確かめる。
      if (requiredField && r && r.ok === true && r[requiredField] === undefined) {
        throw new Error('unexpected response');
      }
      return r;
    } catch (e) {
      lastErr = e;
      if (i < attempts - 1) await new Promise(s => setTimeout(s, 2000 * (i + 1)));
    }
  }
  throw lastErr;
}

/* ボタンを待機中の見た目にする。
 * Apps Script は応答までに5〜15秒かかることがあるので、
 * 「動いている」ことが目で分かるようにしておく。 */
function setBusy(btn, busyLabel) {
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner" role="presentation"></span>' + busyLabel;
}
function setIdle(btn, label) {
  btn.disabled = false;
  btn.textContent = label;
}

function showError(el, text) {
  el.textContent = text;
  el.classList.add('msg-error');
  el.classList.remove('msg-wait', 'msg-caution', 'hidden');
}
// 間違いではないが気づいてほしいこと(報告済みの区分をもう一度選んだ等)
function showCaution(el, text) {
  el.textContent = text;
  el.classList.add('msg-caution');
  el.classList.remove('msg-error', 'msg-wait', 'hidden');
}
// 待っていることを伝えるだけの案内。赤くしないので警告に見えない。
function showWaitNote(el) {
  el.textContent = '送信しています。画面を閉じずにそのままお待ちください。';
  el.classList.add('msg-wait');
  el.classList.remove('msg-error', 'hidden');
}
function clearError(el) {
  el.textContent = '';
  el.classList.add('hidden');
  el.classList.remove('msg-wait', 'msg-caution');
  el.classList.add('msg-error');
}

/* --- 時刻の選択肢(9:30〜17:00 を15分刻み) ----------------------------- */
function buildTimeOptions() {
  const sel = document.getElementById('time');
  const list = [];
  for (let m = 9 * 60 + 30; m <= 17 * 60; m += 15) {
    list.push(Math.floor(m / 60) + ':' + ('0' + (m % 60)).slice(-2));
  }
  sel.innerHTML = list.map(t => `<option value="${t}">${t}</option>`).join('');
  return list;
}

/* --- 昼等休憩の選択肢 --------------------------------------------------
 * 実際の日報では 0:00 / 0:45 / 1:00 / 2:00 の4つしか使われていなかったが、
 * 例外の日もあるので15分刻みで用意する。
 * 初期値は空にしてある。うっかり違う時間のまま送られると、
 * 日報の「時間数」がそのまま狂ってしまうため。 */
function buildKyukeiOptions() {
  const sel  = document.getElementById('kyukei');
  const list = [];
  for (let m = 0; m <= 120; m += 15) {
    list.push(Math.floor(m / 60) + ':' + ('0' + (m % 60)).slice(-2));
  }
  sel.innerHTML = '<option value="">選んでください</option>'
    + list.map(t => `<option value="${t}">${t}</option>`).join('');
}

// いまの時刻に一番近い選択肢を初期値にする
function selectNearestTime(list) {
  const now = new Date();
  const cur = now.getHours() * 60 + now.getMinutes();
  let best = list[0], diff = Infinity;
  list.forEach(t => {
    const [h, m] = t.split(':').map(Number);
    const d = Math.abs(h * 60 + m - cur);
    if (d < diff) { diff = d; best = t; }
  });
  document.getElementById('time').value = best;
}

/* --- ログイン --------------------------------------------------------- */
const loginMsg = document.getElementById('loginMsg');

document.getElementById('pinToggle').addEventListener('click', () => {
  const pin = document.getElementById('pin');
  const btn = document.getElementById('pinToggle');
  const showing = pin.type === 'text';
  pin.type = showing ? 'password' : 'text';
  btn.textContent = showing ? '表示' : '隠す';
  btn.setAttribute('aria-label', showing ? '暗証番号を表示' : '暗証番号を隠す');
});

async function doLogin() {
  const btn    = document.getElementById('btnLogin');
  const userNo = document.getElementById('userNo').value.trim();
  const pin    = document.getElementById('pin').value.trim();
  clearError(loginMsg);

  if (!userNo || !pin) {
    showError(loginMsg, '利用者番号と暗証番号を入力してください。');
    return;
  }

  setBusy(btn, '確認しています…');
  try {
    const r = await callApiRetry({ action: 'login', userNo, pin }, 2, 'token');
    if (r.ok) {
      localStorage.setItem(TOKEN_KEY, r.token);
      document.getElementById('pin').value = '';
      enterReport(r.name, r.today, r.sagyoList);
    } else if (r.error === 'locked') {
      showError(loginMsg, '暗証番号を続けて間違えたため、しばらくログインできません。15分ほど待ってからもう一度お試しください。');
    } else {
      showError(loginMsg, '利用者番号または暗証番号が違います。' +
        (typeof r.rest === 'number' ? `（あと${r.rest}回まで）` : ''));
    }
  } catch (e) {
    showError(loginMsg, '通信に失敗しました。電波の状態を確認して、もう一度お試しください。');
  } finally {
    setIdle(btn, 'ログイン');
  }
}

document.getElementById('btnLogin').addEventListener('click', doLogin);
document.getElementById('pin').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('userNo').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('pin').focus();
});

/* --- 報告画面 --------------------------------------------------------- */
let currentName = '';
let currentKubun = '';
let currentTaicho = '';
let currentToday = { start: '', end: '' };
const reportMsg = document.getElementById('reportMsg');

/* 二重登録を防ぐための引換番号。
 * 「通信に失敗しました」と出ても、実はサーバー側では受け付けられている
 * ことがある。そのまま押し直すと報告が2件になってしまうので、
 * 同じ送信のやり直しには同じ番号を送り、成功したら捨てる。 */
let pendingReqId = null;
function newReqId() {
  return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

/* サーバーから受け取った本日の報告状況を画面に描く。
 * { start: '9:30', end: '' } のような形。空文字なら未報告。 */
/* 職員からの返信を並べる。届いていなければ何も出さない。 */
function renderReplies(el, replies) {
  el.innerHTML = '';
  if (!replies || !replies.length) return;

  replies.forEach(r => {
    const box  = document.createElement('div');
    const head = document.createElement('div');
    const body = document.createElement('div');
    box.className  = 'reply';
    head.className = 'reply-head';
    body.className = 'reply-body';
    head.textContent = (r.who || '職員') + ' より' + (r.at ? '（' + r.at + '）' : '');
    body.textContent = r.text || '';
    box.appendChild(head);
    box.appendChild(body);
    el.appendChild(box);
  });
}

function renderTodayStatus(today) {
  currentToday = today || { start: '', end: '' };
  [['start', 'ts-start'], ['end', 'ts-end']].forEach(([key, id]) => {
    const time = currentToday[key];
    const el   = document.getElementById(id);
    const mark = document.getElementById(id + '-mark');
    if (time) {
      mark.textContent = '✓';
      mark.className = 'mark done';
      el.textContent = time + ' に報告済み';
      el.className = 'done';
    } else {
      mark.textContent = '—';
      mark.className = 'mark yet';
      el.textContent = 'まだ報告していません';
      el.className = 'yet';
    }
    renderReplies(document.getElementById(id + '-replies'), currentToday[key + 'Replies']);
  });
}

/* 本人が前に書いた訓練・作業内容をボタンで並べる。
 * ★ここに出るのは必ず本人の入力だけ(サーバー側で名前で絞っている)。
 *   他の利用者の入力を混ぜてはいけない。 */
function renderSagyoSuggest(list) {
  const box   = document.getElementById('sagyoSuggest');
  const label = document.getElementById('sagyoSuggestLabel');
  box.innerHTML = '';
  const items = Array.isArray(list) ? list : [];
  label.classList.toggle('hidden', items.length === 0);

  items.forEach(text => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = text;
    b.addEventListener('click', () => {
      document.getElementById('sagyo').value = text;
      document.getElementById('sagyo').focus();
    });
    box.appendChild(b);
  });
}

function enterReport(name, today, sagyoList) {
  currentName = name;
  renderTodayStatus(today);
  if (sagyoList !== undefined) renderSagyoSuggest(sagyoList);
  document.getElementById('greet').textContent = name + ' さん';

  const d = new Date();
  const week = ['日', '月', '火', '水', '木', '金', '土'][d.getDay()];
  document.getElementById('today').textContent =
    `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${week}）`;

  selectNearestTime(timeList);
  document.getElementById('memo').value   = '';
  document.getElementById('sagyo').value  = '';
  document.getElementById('biko').value   = '';
  document.getElementById('kyukei').value = '';
  setTaicho('');
  pendingReqId = null;   // 新しい報告なので引換番号もリセット
  clearError(reportMsg);

  // 午前なら始業、午後なら終業を初期選択にしておく。
  // 報告済みの案内を出すことがあるので、clearError より後に呼ぶこと。
  setKubun(d.getHours() < 12 ? '始業' : '終業');
  show('report');
}

function setTaicho(t) {
  currentTaicho = t;
  document.querySelectorAll('.choice button').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.taicho === t));
  });
}
document.querySelectorAll('.choice button').forEach(b => {
  b.addEventListener('click', () => setTaicho(b.dataset.taicho));
});

function setKubun(k) {
  currentKubun = k;
  document.querySelectorAll('.kubun button').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.kubun === k));
  });

  /* 日報の項目は始業と終業で書くものが違う。
   * 関係のない欄を出しておくと迷わせるので、まるごと出し分ける。 */
  document.getElementById('sec-start').classList.toggle('hidden', k !== '始業');
  document.getElementById('sec-end').classList.toggle('hidden', k !== '終業');

  // すでに報告済みの区分を選んだら知らせる。
  // 訂正したい場合もあるので、止めはせず案内だけにする。
  const already = (k === '始業') ? currentToday.start : currentToday.end;
  if (already) {
    showCaution(reportMsg, '本日の' + k + 'は ' + already + ' に報告済みです。'
      + 'このまま送信すると、もう1件記録されます。');
  } else {
    clearError(reportMsg);
  }
}
document.querySelectorAll('.kubun button').forEach(b => {
  b.addEventListener('click', () => setKubun(b.dataset.kubun));
});

/* 送信完了画面に、実際に送った項目だけを並べる */
function renderSummary(rows) {
  const dl = document.getElementById('s-list');
  dl.innerHTML = '';
  rows.forEach(([k, v]) => {
    if (!v) return;
    const div = document.createElement('div');
    const dt  = document.createElement('dt');
    const dd  = document.createElement('dd');
    dt.textContent = k;
    dd.textContent = v;
    div.appendChild(dt);
    div.appendChild(dd);
    dl.appendChild(div);
  });
}

/* 送信が成功したときの後始末。
 * ふつうに応答が返ったときと、あとから「入っていました」と分かったときの
 * 両方から呼ぶので、1か所にまとめてある。 */
function finishSent(r, f) {
  pendingReqId = null;
  // サーバーが返す最新の状況を覚えておく。
  // 「続けて報告する」で戻ったとき、いま出した分が反映されている。
  currentToday = r.today || currentToday;
  if (r.sagyoList) renderSagyoSuggest(r.sagyoList);
  renderSummary([
    ['名前', r.name || currentName],
    ['区分', f.kubun],
    ['時刻', f.time],
    ['体調', f.taicho],
    ['昼等休憩', f.kyukei],
    ['訓練・作業内容', f.sagyo],
    ['備考', f.biko],
    ['自由記述', f.memo]
  ]);
  show('done');
}

/* ★送れたかどうかをサーバーに聞きに行く(2026-08-13追加)。
 *
 * Apps Scriptは、処理そのものは終わっているのに応答だけがブラウザまで
 * 届かないことがある。そのままだと「通信に失敗しました」と出るのに
 * スプレッドシートには記録されている、という一番まぎらわしい状態になる
 * (2026-08-13にユーザーが実際に遭遇し、押し直して確かめる羽目になった)。
 *
 * サーバーは引換番号ごとに結果を10分間保存しているので、それを問い合わせれば
 * 「本当に登録されたか」を確実に判定できる。
 * この問い合わせ自体も失敗しうるので、そのときは null を返して
 * 「確認できなかった」として扱う。 */
async function confirmSent(reqId) {
  if (!reqId) return null;
  try {
    const r = await callApiRetry({
      action: 'check',
      token: localStorage.getItem(TOKEN_KEY),
      reqId
    }, 1, 'found');
    return (r && r.ok && r.found) ? r : null;
  } catch (e) {
    return null;
  }
}

document.getElementById('btnSend').addEventListener('click', async () => {
  const btn    = document.getElementById('btnSend');
  const time   = document.getElementById('time').value;
  const memo   = document.getElementById('memo').value.trim();
  const kyukei = document.getElementById('kyukei').value;
  const sagyo  = document.getElementById('sagyo').value.trim();
  const biko   = document.getElementById('biko').value.trim();
  const taicho = currentTaicho;
  clearError(reportMsg);

  // 足りない項目があれば、その欄まで案内する
  if (!currentKubun) {
    showError(reportMsg, '「始業」か「終業」を選んでください。');
    return;
  }
  if (currentKubun === '始業' && !taicho) {
    showError(reportMsg, '体調を選んでください。');
    document.getElementById('sec-start').scrollIntoView({ block: 'center' });
    return;
  }
  if (currentKubun === '終業' && !kyukei) {
    showError(reportMsg, '昼等休憩の時間を選んでください。休んでいない場合は 0:00 を選んでください。');
    document.getElementById('kyukei').focus();
    return;
  }
  if (currentKubun === '終業' && !sagyo) {
    showError(reportMsg, '訓練・作業内容を入力してください。');
    document.getElementById('sagyo').focus();
    return;
  }

  if (!pendingReqId) pendingReqId = newReqId();

  const fields = { kubun: currentKubun, time, taicho, kyukei, sagyo, biko, memo };

  setBusy(btn, '送信しています…');
  showWaitNote(reportMsg);
  try {
    const payload = Object.assign({
      action: 'report',
      token: localStorage.getItem(TOKEN_KEY),
      reqId: pendingReqId
    }, fields);

    const r = await callApiRetry(payload, 2, 'uid');

    if (r.ok) {
      finishSent(r, fields);
    } else if (r.error === 'unauthorized') {
      logout('ログインの有効期限が切れました。もう一度ログインしてください。');
    } else {
      showError(reportMsg, '送信できませんでした。入力内容を確認して、もう一度お試しください。');
    }
  } catch (e) {
    /* ここに来ても、サーバー側では登録できていることがある。
     * 決めつけてエラーを出す前に、本当に入ったのかを聞きに行く。 */
    setBusy(btn, '確認しています…');
    const done = await confirmSent(pendingReqId);
    if (done) {
      finishSent(done, fields);
    } else {
      showError(reportMsg, '送信できたかどうか確認できませんでした。'
        + 'もう一度「送信する」を押してください。'
        + '同じ報告が二重に登録されることはありません。');
    }
  } finally {
    setIdle(btn, '送信する');
  }
});

document.getElementById('btnAgain').addEventListener('click', () => enterReport(currentName, currentToday));

/* --- これまでの報告 ---------------------------------------------------
 * 見るだけの画面。ここから報告を出したり直したりはできない。
 * --------------------------------------------------------------------- */
const historyMsg = document.getElementById('historyMsg');

function histBlock(kindLabel, cls, data, fields) {
  const blk  = document.createElement('div');
  const kind = document.createElement('span');
  blk.className  = 'histblk';
  kind.className = 'kind ' + cls;
  kind.textContent = kindLabel;
  blk.appendChild(kind);

  if (!data) {
    const p = document.createElement('div');
    p.className = 'histnone';
    p.textContent = '報告はありません';
    blk.appendChild(p);
    return blk;
  }

  const dl = document.createElement('dl');
  dl.style.margin = '0';
  fields.forEach(([label, key]) => {
    if (!data[key]) return;
    const row = document.createElement('div');
    const dt  = document.createElement('dt');
    const dd  = document.createElement('dd');
    row.className = 'item';
    dt.textContent = label;
    dd.textContent = data[key];
    row.appendChild(dt);
    row.appendChild(dd);
    dl.appendChild(row);
  });
  blk.appendChild(dl);

  const rep = document.createElement('div');
  renderReplies(rep, data.replies);
  blk.appendChild(rep);
  return blk;
}

function renderHistory(days) {
  const box = document.getElementById('historyBody');
  box.innerHTML = '';

  if (!days || !days.length) {
    const p = document.createElement('p');
    p.className = 'hint';
    p.style.textAlign = 'center';
    p.textContent = 'まだ報告がありません。';
    box.appendChild(p);
    return;
  }

  days.forEach(d => {
    const card = document.createElement('section');
    const h    = document.createElement('h3');
    card.className = 'histday';
    h.textContent  = d.date;
    card.appendChild(h);
    card.appendChild(histBlock('始業', 'start', d.start,
      [['時刻', 'time'], ['体調', 'taicho'], ['自由記述', 'memo']]));
    card.appendChild(histBlock('終業', 'end', d.end,
      [['時刻', 'time'], ['昼等休憩', 'kyukei'], ['訓練・作業内容', 'sagyo'],
       ['備考', 'biko'], ['自由記述', 'memo']]));
    box.appendChild(card);
  });
}

document.getElementById('btnHistory').addEventListener('click', async () => {
  const btn = document.getElementById('btnHistory');
  clearError(historyMsg);
  document.getElementById('historyBody').innerHTML =
    '<p class="hint" style="text-align:center;">読み込んでいます…</p>';
  show('history');

  btn.disabled = true;
  try {
    const r = await callApiRetry({
      action: 'history',
      token: localStorage.getItem(TOKEN_KEY),
      days: 14
    }, 2, 'days');

    if (r.ok) {
      renderHistory(r.days);
    } else if (r.error === 'unauthorized') {
      logout('ログインの有効期限が切れました。もう一度ログインしてください。');
    } else {
      document.getElementById('historyBody').innerHTML = '';
      showError(historyMsg, '読み込めませんでした。もう一度お試しください。');
    }
  } catch (e) {
    document.getElementById('historyBody').innerHTML = '';
    showError(historyMsg, '通信に失敗しました。電波の状態を確認して、もう一度お試しください。');
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('btnHistoryBack').addEventListener('click', () => show('report'));

/* --- ログアウト ------------------------------------------------------- */
function logout(message) {
  localStorage.removeItem(TOKEN_KEY);
  currentName = '';
  document.getElementById('userNo').value = '';
  document.getElementById('pin').value = '';
  clearError(loginMsg);
  if (message) showError(loginMsg, message);
  show('login');
}
document.getElementById('btnLogout').addEventListener('click', () => logout());
document.getElementById('btnLogout2').addEventListener('click', () => logout());

/* --- 起動時: 保存済みのログイン状態があれば自動で報告画面へ ------------- */
const timeList = buildTimeOptions();
buildKyukeiOptions();

(async function start() {
  const token = localStorage.getItem(TOKEN_KEY);
  if (!token) { show('login'); return; }

  show('loading');   // 確認が終わるまで数秒あるので、空白の画面を見せない
  try {
    const r = await callApiRetry({ action: 'me', token }, 2, 'name');
    if (r.ok) { enterReport(r.name, r.today, r.sagyoList); return; }
    // 期限切れなど、サーバーが明確に「無効」と答えた場合だけ捨てる
    localStorage.removeItem(TOKEN_KEY);
    show('login');
    showError(loginMsg, 'ログインの有効期限が切れました。もう一度ログインしてください。');
  } catch (e) {
    // 通信できなかっただけならログイン情報は消さない。
    // 消してしまうと、電波が悪いたびに番号の入力をやり直させることになる。
    show('login');
    showError(loginMsg, '通信に失敗しました。電波の状態を確認して、画面を再読み込みしてください。');
  }
})();
</script>
